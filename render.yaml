services:
  # 1. Flask IA Microservice
  - type: web
    name: spark-ia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    rootDir: ml
    plan: free

  # 2. Express Backend
  - type: web
    name: spark-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend/S_park_api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spark-db
          property: connectionString
      - key: FLASK_API_URL
        fromService:
          type: web
          name: spark-ia
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 3. Web Admin Panel (Sitio Estático)
  - type: web
    name: spark-admin-panel
    env: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist/S-park
    rootDir: frontend

databases:
  # 4. PostgreSQL Database
  - name: spark-db
    plan: free