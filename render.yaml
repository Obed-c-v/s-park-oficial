services:
  # 1. Flask IA Microservice
  - type: web
    name: spark-ia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    rootDir: ml
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Express Backend
  - type: web
    name: spark-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend/S_park_api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spark-db
          property: connectionString
      - key: ML_API_URL
        fromService:
          type: web
          name: spark-ia
          property: host
      - key: FLASK_API_URL
        fromService:
          type: web
          name: spark-ia
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 3. Angular Static Frontend (Panel Administrativo)
  - type: web
    name: spark-frontend
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npx ng build
    staticPublishPath: ./dist/S-park
    rootDir: frontend
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 4. PostgreSQL Database
  - name: spark-db
    plan: free