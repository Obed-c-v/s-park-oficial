<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #0f172a; --color: white;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab5" style="--color: white;"></ion-back-button>
    </ion-buttons>
    <ion-title style="font-weight: 700; letter-spacing: 0.5px;">Seguridad</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #f8fafc;">
  <div style="padding: 20px;">

    <!-- Código PIN -->
    <h3 style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin: 8px 8px 10px 8px; letter-spacing: 0.8px;">
      Código PIN de Acceso Rápido
    </h3>
    <div style="background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; padding: 12px 16px; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.02);">
      <ion-item lines="none" style="--background: transparent; margin-bottom: 8px; --padding-start: 0;">
        <ion-label>
          <h3 style="font-weight: 700; font-size: 14px; color: #0f172a;">Activar acceso con PIN</h3>
          <p style="font-size: 11.5px; color: #64748b;">Sustituye la contraseña al abrir la aplicación</p>
        </ion-label>
        <ion-toggle slot="end" [(ngModel)]="activaPin" (ionChange)="guardarSeguridad()" color="success"></ion-toggle>
      </ion-item>

      <div *ngIf="activaPin" style="margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 16px;">
        <ion-item lines="none" style="--background: transparent; --padding-start: 0; margin-bottom: 12px;">
          <ion-label position="stacked" style="color: #475569; font-weight: 700; font-size: 12px; text-transform: uppercase;">PIN de 4 dígitos</ion-label>
          <ion-input type="password" [(ngModel)]="pinSeguridad" maxlength="4" placeholder="••••" style="font-size: 24px; font-weight: 800; letter-spacing: 12px; color: #0f172a; text-align: center; max-width: 150px; margin: 8px auto 0 auto;"></ion-input>
        </ion-item>
        <ion-button expand="block" size="small" fill="outline" (click)="guardarSeguridad()" style="--border-radius: 10px; font-weight: 700; height: 38px;">
          Guardar PIN
        </ion-button>
      </div>
    </div>

    <!-- Modificación de Contraseña -->
    <h3 style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin: 0 8px 10px 8px; letter-spacing: 0.8px;">
      Cambiar Contraseña
    </h3>
    
    <div style="background: white; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 16px rgba(0,0,0,0.02);">
      <ion-item lines="full" style="--padding-start: 0; margin-bottom: 12px; --background: transparent;">
        <ion-label position="stacked" style="color: #475569; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Contraseña actual</ion-label>
        <ion-input type="password" [(ngModel)]="passwordActual" placeholder="Ingresa tu contraseña actual" style="font-weight: 500; font-size: 14.5px;"></ion-input>
      </ion-item>

      <ion-item lines="full" style="--padding-start: 0; margin-bottom: 12px; --background: transparent;">
        <ion-label position="stacked" style="color: #475569; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Nueva contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="passwordNueva" placeholder="Mínimo 6 caracteres" style="font-weight: 500; font-size: 14.5px;"></ion-input>
      </ion-item>

      <ion-item lines="none" style="--padding-start: 0; margin-bottom: 16px; --background: transparent;">
        <ion-label position="stacked" style="color: #475569; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Confirmar nueva contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="passwordConfirm" placeholder="Confirma tu nueva contraseña" style="font-weight: 500; font-size: 14.5px;"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="cambiarPassword()" [disabled]="cargando" style="--border-radius: 12px; font-weight: 700; height: 46px; margin-top: 24px;">
        <ion-spinner *ngIf="cargando" name="crescent" slot="start"></ion-spinner>
        Actualizar Contraseña
      </ion-button>
    </div>

  </div>
</ion-content>
