<div class="settings-container">
    <div class="settings-card">
        <header class="settings-header">
            <h1>Perfil Profesional</h1>
            <p>Gestiona tu información personal y credenciales médicas</p>
        </header>

        <section class="settings-section">
            <h2 class="section-title">Información de Perfil</h2>
            <div class="profile-header-settings">
                <div class="avatar-container">
                    <div class="avatar-large">{{userProfile.avatar}}</div>
                    <button class="btn-text-action">Cambiar foto</button>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" [(ngModel)]="userProfile.fullName" placeholder="Dr. Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" [(ngModel)]="userProfile.email" placeholder="juan.perez@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Número de Licencia Médica</label>
                    <input type="text" [(ngModel)]="userProfile.licenseNumber" placeholder="ML-XXXXX">
                </div>
                <div class="form-group">
                    <label>Hospital o Clínica</label>
                    <input type="text" [(ngModel)]="userProfile.hospital" placeholder="Centro Médico Central">
                </div>
                <div class="form-group">
                    <label>Especialidad</label>
                    <input type="text" [(ngModel)]="userProfile.specialty" placeholder="Neurología">
                </div>
                <div class="form-group">
                    <label>Número de Teléfono</label>
                    <input type="tel" [(ngModel)]="userProfile.phoneNumber" placeholder="+XX XXX XXX XXX">
                </div>
            </div>
            <div class="action-footer">
                <button class="btn-primary" (click)="saveProfile()">Guardar Cambios</button>
            </div>
        </section>

        <hr class="separator">

        <!-- Security Section -->
        <section class="settings-section">
            <h2 class="section-title">{{ settingsService.translate('security') }}</h2>
            <div class="form-grid single-column">
                <div class="form-group">
                    <label>{{ settingsService.translate('current_password') }}</label>
                    <input type="password" [(ngModel)]="security.currentPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>{{ settingsService.translate('new_password') }}</label>
                    <input type="password" [(ngModel)]="security.newPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>{{ settingsService.translate('confirm_password') }}</label>
                    <input type="password" [(ngModel)]="security.confirmPassword" placeholder="••••••••">
                </div>
            </div>
            <div class="action-footer">
                <button class="btn-primary" (click)="changePassword()">{{ settingsService.translate('change_password')
                    }}</button>
            </div>
        </section>
    </div>
</div>
