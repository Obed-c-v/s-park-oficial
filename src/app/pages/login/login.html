<div class="login-container">
    <div class="login-card" @fadeInSlide>
        <header class="login-header">
            <div class="logo">
                <img src="assets/images/t.jpg" alt="S-park Logo" class="login-logo">
                <h1 class="brand">S-park</h1>
            </div>
            <p class="description">Plataforma de apoyo al diagnóstico de Parkinson mediante análisis de voz</p>
        </header>

        <form class="login-form" (submit)="onLogin(); $event.preventDefault()">
            @if (errorMessage) {
            <div class="error-alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span>{{ errorMessage }}</span>
            </div>
            }

            <div class="form-group">
                <label for="email">Correo electrónico profesional</label>
                <input type="email" id="email" [(ngModel)]="email" name="email"
                    [class.is-invalid]="errorMessage && !email" placeholder="ejemplo@medicina.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    [class.is-invalid]="errorMessage && !password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Iniciar sesión</button>

            <div class="form-footer">
                <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
            </div>
        </form>

        <footer class="login-footer">
            <div class="info-badge">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="info-icon">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path d="M12 16V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span>Plataforma de uso clínico exclusivo para profesionales de la salud.</span>
            </div>
        </footer>
    </div>
</div>
